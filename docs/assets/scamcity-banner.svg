<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">ScamCity — AI Society Simulation Lab</title>
  <desc id="desc">A cinematic command center showing a synthetic city, scam agents, live metrics and intervention controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03090e"/><stop offset=".52" stop-color="#071722"/><stop offset="1" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafaff"/><stop offset=".68" stop-color="#c8f8fb"/><stop offset="1" stop-color="#46d9e6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b202c" stop-opacity=".94"/><stop offset="1" stop-color="#07131c" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="cyanAura" cx="78%" cy="38%" r="48%">
      <stop offset="0" stop-color="#46d9e6" stop-opacity=".19"/><stop offset="1" stop-color="#46d9e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura" cx="12%" cy="100%" r="55%">
      <stop offset="0" stop-color="#9a7bff" stop-opacity=".15"/><stop offset="1" stop-color="#9a7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#79b2cb" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="round"><rect width="1280" height="560" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <rect width="1280" height="560" fill="url(#cyanAura)"/>
    <rect width="1280" height="560" fill="url(#violetAura)"/>
    <rect width="1280" height="560" fill="url(#grid)"/>
    <circle cx="1030" cy="135" r="170" fill="#46d9e6" opacity=".035" filter="url(#soft)"/>

    <!-- top rail -->
    <g font-family="Segoe UI,Arial,sans-serif">
      <circle cx="58" cy="42" r="4" fill="#40e0a0" filter="url(#glow)"/>
      <text x="72" y="47" fill="#40e0a0" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ONLINE</text>
      <text x="1092" y="47" fill="#668694" font-family="monospace" font-size="11">SEED 42  /  LIVE</text>
      <path d="M44 66H1236" stroke="#79b2cb" stroke-opacity=".18"/>
    </g>

    <!-- brand copy -->
    <g transform="translate(66 102)" font-family="Segoe UI,Arial,sans-serif">
      <g>
        <rect width="54" height="54" rx="9" fill="#07151e" stroke="#46d9e6" stroke-width="1.5"/>
        <path d="M13 14h28v6H13zm0 10h18v6H13zm0 10h28v6H13z" fill="#46d9e6"/>
        <path d="M35 24h6v6h-6z" fill="#fb3b50"/>
        <circle cx="41" cy="10" r="3.5" fill="#40e0a0"/>
      </g>
      <text x="0" y="91" fill="#46d9e6" font-size="13" font-weight="700" letter-spacing="4.2">AI SOCIETY SIMULATION LAB</text>
      <text x="-3" y="166" fill="url(#titleGrad)" font-size="78" font-weight="850" letter-spacing="-4">SCAM<tspan fill="#46d9e6">CITY</tspan></text>
      <text x="1" y="204" fill="#9bb3be" font-size="19">Before an intervention reaches millions,</text>
      <text x="1" y="232" fill="#e5f1f5" font-size="19" font-weight="650">test it on a synthetic society first.</text>

      <!-- process -->
      <g transform="translate(0 277)">
        <path d="M14 16H345" stroke="#79b2cb" stroke-opacity=".24" stroke-dasharray="4 6"/>
        <g font-size="10" font-weight="700" letter-spacing="1.2">
          <circle cx="14" cy="16" r="13" fill="#46d9e6" fill-opacity=".13" stroke="#46d9e6"/><text x="10.5" y="20" fill="#46d9e6">1</text><text x="0" y="48" fill="#7595a3">SIMULATE</text>
          <circle cx="124" cy="16" r="13" fill="#fb3b50" fill-opacity=".13" stroke="#fb3b50"/><text x="120.5" y="20" fill="#fb3b50">2</text><text x="105" y="48" fill="#7595a3">ATTACK</text>
          <circle cx="234" cy="16" r="13" fill="#9a7bff" fill-opacity=".13" stroke="#9a7bff"/><text x="230.5" y="20" fill="#b9a8ff">3</text><text x="207" y="48" fill="#7595a3">INTERVENE</text>
          <circle cx="345" cy="16" r="13" fill="#40e0a0" fill-opacity=".13" stroke="#40e0a0"/><text x="341.5" y="20" fill="#40e0a0">4</text><text x="321" y="48" fill="#7595a3">COMPARE</text>
        </g>
      </g>

      <g transform="translate(0 358)" font-size="10" font-weight="700" letter-spacing="1.1">
        <rect width="146" height="34" rx="17" fill="#40e0a0" fill-opacity=".08" stroke="#40e0a0" stroke-opacity=".55"/>
        <circle cx="18" cy="17" r="4" fill="#40e0a0"/><text x="31" y="21" fill="#40e0a0">REPLAYABLE</text>
        <rect x="158" width="160" height="34" rx="17" fill="#9a7bff" fill-opacity=".08" stroke="#9a7bff" stroke-opacity=".5"/>
        <text x="177" y="21" fill="#b9a8ff">WEB + MINECRAFT</text>
      </g>
    </g>

    <!-- dashboard mock -->
    <g transform="translate(590 92)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="620" height="410" rx="17" fill="#050d13" stroke="#79b2cb" stroke-opacity=".28"/>
      <rect x="15" y="15" width="590" height="41" rx="9" fill="#0a1821" stroke="#79b2cb" stroke-opacity=".13"/>
      <text x="31" y="40" fill="#dcecf1" font-size="12" font-weight="700" letter-spacing="1.2">CITY COMMAND CENTER</text>
      <circle cx="510" cy="35" r="4" fill="#40e0a0" filter="url(#glow)"/>
      <text x="521" y="39" fill="#40e0a0" font-size="9" font-weight="700" letter-spacing="1">LIVE API</text>
      <text x="574" y="39" fill="#557581" font-family="monospace" font-size="8">T+18</text>

      <!-- map panel -->
      <rect x="15" y="70" width="382" height="258" rx="10" fill="url(#panel)" stroke="#79b2cb" stroke-opacity=".18"/>
      <text x="31" y="94" fill="#668694" font-family="monospace" font-size="9" letter-spacing="1">SOCIAL RISK MAP</text>
      <text x="331" y="94" fill="#46d9e6" font-family="monospace" font-size="8">100 NODES</text>
      <g transform="translate(27 105)" stroke="#4c91ff" stroke-opacity=".24" stroke-width="1.2">
        <path d="M31 53L92 26l58 48 72-38 93 43M31 53l48 82 71-61 50 91 115-86M79 135l-37 73 108 5 50-48 107 65M150 213l-58-78m215 95l8-151M222 36l-22 129M92 26l0 109"/>
      </g>
      <g transform="translate(27 105)" fill="#46d9e6" stroke="#07131c" stroke-width="4">
        <circle cx="31" cy="53" r="7"/><circle cx="92" cy="26" r="9"/><circle cx="150" cy="74" r="7"/><circle cx="222" cy="36" r="8"/><circle cx="315" cy="79" r="7"/>
        <circle cx="79" cy="135" r="8"/><circle cx="200" cy="165" r="11" fill="#40e0a0"/><circle cx="42" cy="208" r="7"/><circle cx="150" cy="213" r="8"/><circle cx="307" cy="230" r="8"/>
      </g>
      <circle cx="227" cy="270" r="19" fill="none" stroke="#40e0a0" stroke-opacity=".4" filter="url(#glow)"/>
      <g transform="translate(27 105)" fill="#fb3b50" stroke="#07131c" stroke-width="4">
        <path d="M278 103l9 15-9 15-9-15z"/><path d="M116 157l8 14-8 14-8-14z"/>
      </g>
      <path d="M305 223Q280 242 238 264" fill="none" stroke="#fb3b50" stroke-width="2" stroke-dasharray="5 5"/>
      <g font-family="monospace" font-size="8">
        <circle cx="32" cy="311" r="3" fill="#46d9e6"/><text x="41" y="314" fill="#668694">CITIZEN</text>
        <circle cx="98" cy="311" r="3" fill="#fb3b50"/><text x="107" y="314" fill="#668694">SCAMMER</text>
        <circle cx="173" cy="311" r="3" fill="#40e0a0"/><text x="182" y="314" fill="#668694">PROTECTED</text>
      </g>

      <!-- metrics -->
      <rect x="410" y="70" width="195" height="122" rx="10" fill="url(#panel)" stroke="#79b2cb" stroke-opacity=".18"/>
      <text x="426" y="94" fill="#668694" font-family="monospace" font-size="9" letter-spacing="1">LIVE METRICS</text>
      <text x="426" y="130" fill="#e5f1f5" font-size="25" font-weight="750">03</text><text x="465" y="128" fill="#668694" font-size="9">VICTIMS</text>
      <text x="426" y="162" fill="#fb3b50" font-size="19" font-weight="750">$8,420</text><text x="509" y="160" fill="#668694" font-size="9">LOSS</text>
      <path d="M426 177h158" stroke="#79b2cb" stroke-opacity=".12"/>

      <!-- intervention -->
      <rect x="410" y="205" width="195" height="123" rx="10" fill="url(#panel)" stroke="#9a7bff" stroke-opacity=".28"/>
      <text x="426" y="230" fill="#9a7bff" font-family="monospace" font-size="9" letter-spacing="1">INTERVENTION</text>
      <text x="426" y="257" fill="#e5f1f5" font-size="13" font-weight="700">SOCIAL GUARDIAN</text>
      <text x="426" y="277" fill="#668694" font-size="9">Trusted contact activated</text>
      <rect x="426" y="293" width="158" height="20" rx="4" fill="#40e0a0"/>
      <text x="461" y="307" fill="#041117" font-size="8" font-weight="800" letter-spacing="1">PROTECTION ACTIVE</text>

      <!-- timeline -->
      <rect x="15" y="342" width="590" height="53" rx="9" fill="#0a1821" stroke="#79b2cb" stroke-opacity=".13"/>
      <text x="31" y="363" fill="#668694" font-family="monospace" font-size="8">EVENT STREAM</text>
      <path d="M31 378H578" stroke="#79b2cb" stroke-opacity=".16"/>
      <circle cx="85" cy="378" r="4" fill="#46d9e6"/><circle cx="204" cy="378" r="4" fill="#fb3b50"/><circle cx="342" cy="378" r="4" fill="#facc15"/><circle cx="491" cy="378" r="5" fill="#40e0a0" filter="url(#glow)"/>
      <text x="31" y="389" fill="#4c6975" font-family="monospace" font-size="7">CONTACT</text><text x="180" y="389" fill="#4c6975" font-family="monospace" font-size="7">TRUST</text><text x="321" y="389" fill="#4c6975" font-family="monospace" font-size="7">RISK</text><text x="465" y="389" fill="#40e0a0" font-family="monospace" font-size="7">BLOCKED</text>
    </g>

    <path d="M0 532H1280" stroke="#46d9e6" stroke-opacity=".18"/>
    <text x="66" y="547" fill="#47636f" font-family="monospace" font-size="9" letter-spacing="1.5">100% SYNTHETIC DATA  •  DETERMINISTIC CORE  •  EXPLAINABLE OUTCOMES</text>
  </g>
  <rect x="1" y="1" width="1278" height="558" rx="25" fill="none" stroke="#79b2cb" stroke-opacity=".3"/>
</svg>
